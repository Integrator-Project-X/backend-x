services:
  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME}
    working_dir: /usr/src/app
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ./app:/usr/src/app
      - ./.env:/usr/src/app/.env
      - /usr/src/app/node_modules
    env_file:
      - ./.env

    # ❗ ESTA ERA LA QUE DAÑABA LA CONEXIÓN (la eliminamos)
    # environment:
    #   - NODE_ENV=${NODE_ENV}
    #   - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}

    # ❗ ESTO TAMBIÉN LO ELIMINAMOS (ya NO dependes del contenedor Postgres)
    # depends_on:
    #   - db

    # 🔥 DNS PARA QUE PUEDA RESOLVER SUPABASE
    dns:
      - 8.8.8.8
      - 1.1.1.1

    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT}"
          memory: ${APP_MEM_LIMIT}
    networks:
      - backend


  # ❗ OPCIONAL: puedes BORRARLO completamente si ya NO quieres Postgres local
  db:
    image: postgres:15-alpine
    ports:
      - "$POSTGRES_LOCAL:$POSTGRES_PORT"
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT}"
          memory: ${DB_MEM_LIMIT}
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
